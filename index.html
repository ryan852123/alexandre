<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escola de Música</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5fc;--card:#fff;--ink:#0f2540;--mut:#566b85;--acc:#1d4ed8;--gold:#e0a21b;--line:#d3deee;--ok:#1b7a3d;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0b1730;--card:#12254a;--ink:#e8eefb;--mut:#9fb3d6;--acc:#6aa3ff;--gold:#f2c14e;--line:#1f3866;--ok:#5fd18a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
main{max-width:680px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:2rem;font-weight:800;margin:6px 0;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:20px 0 10px}
p{margin:0 0 12px;color:var(--mut)}
.staff{height:30px;margin:12px 0;background:repeating-linear-gradient(var(--gold) 0 2px,transparent 2px 7px);opacity:.7}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
form,.box{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
label{font-size:.9rem;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:none;color:var(--acc);border:1px solid var(--acc);padding:7px 12px}
.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad);padding:7px 12px}
.lnk{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;text-decoration:underline}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row small{display:block;color:var(--mut)}
.acts{display:flex;gap:6px;flex-shrink:0}
.tag{font-weight:700}.ok{color:var(--ok)}.no{color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mut)}
.err{color:var(--bad);font-weight:600}
.sm{display:block;color:var(--mut);font-size:.9rem}
details{margin-top:8px}summary{cursor:pointer;color:var(--acc);font-weight:600}
a{color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:10px 0}
.cal button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 0;font:inherit;cursor:pointer;min-height:46px}
.cal button.sel{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.cal button.hoje{box-shadow:inset 0 0 0 2px var(--gold)}
.i-a,.i-e,.i-s{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 1px}
.i-a{background:var(--acc)}.i-e{background:var(--gold)}.i-s{background:var(--bad)}
.cal button.sel .i-a,.cal button.sel .i-e,.cal button.sel .i-s{background:var(--bg)}
.tabs{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.paper{background:#fff;color:#111;border:2px solid #1d4ed8;border-radius:12px;overflow:hidden;margin:12px 0}
.paper .hd{background:#1d4ed8;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.paper .hd b{font-size:1.2rem}
.paper .bd{padding:22px;display:grid;gap:14px;line-height:1.7}
.paper .val{font-size:1.8rem;font-weight:800;color:#1d4ed8}
.paper .ln{border-top:1px solid #111;margin-top:34px;padding-top:6px;text-align:center;font-size:.9rem}
.paper .ft{font-size:.78rem;color:#555;border-top:1px dashed #999;padding-top:10px}
@media print{:root{--bg:#fff;--card:#fff;--ink:#000;--mut:#333;--line:#000}.noprint,.top{display:none!important}.paper{border-color:#000}.paper .hd{background:#1d4ed8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<main><div id="app"><p>Carregando…</p></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,getDocs,query,where,serverTimestamp,addDoc,arrayUnion,arrayRemove,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ====== TROQUE AQUI ======
const firebaseConfig={apiKey:"AIzaSyAuzIOxZuc54kjU-3fw8Vt_wM09D9FuFI4",authDomain:"escola-alexandre.firebaseapp.com",projectId:"escola-alexandre",appId:"1:186501325334:web:5b76153cdd1456beda0b37"};
const ESCOLA="Escola de Música";
const DOC_ESCOLA=""; // opcional: CNPJ do recebedor (aparece no recibo)
const INSTRUMENTOS=["Violão","Teclado","Bateria","Canto","Baixo","Violino"];
// =========================

const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore();
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const br=d=>d?d.split("-").reverse().join("/"):"";
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
let user,isAdmin=false,tab="pend",alunos=[],pays={},me=null,classes=[],mats=[],teachers=[],att={},isTeacher=false,curClass=null,curDate="",cdia=nomeHoje(),fmes=hojeISO().slice(0,7),notices=[],stab="inicio",calMes=hojeISO().slice(0,7),calDia=hojeISO(),view=null,msg="";
let mes=hojeISO().slice(0,7);

onAuthStateChanged(auth,async u=>{
  user=u;msg="";
  if(!u)return draw();
  try{isAdmin=(await getDoc(doc(db,"admins",u.email.toLowerCase()))).exists()}catch(e){isAdmin=false}
  isTeacher=false;view=null;curClass=null;
  if(!isAdmin){try{isTeacher=(await getDoc(doc(db,"teachers",u.email.toLowerCase()))).exists()}catch(e){isTeacher=false}}
  try{isAdmin?await loadAdmin():isTeacher?await loadTeacher():await loadMe()}catch(e){msg="Não foi possível carregar os dados. Verifique as regras do Firestore.";console.error(e)}
  draw();
});
const all=async c=>(await getDocs(collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const mine=async(c,f,op,v)=>(await getDocs(query(collection(db,c),where(f,op,v)))).docs.map(d=>({id:d.id,...d.data()}));
async function loadAdmin(){
  alunos=await all("students");classes=await all("classes");mats=await all("enrollments");teachers=await all("teachers");notices=await all("notices");
  att={};(await all("attendance")).forEach(a=>att[a.id]=a);
  pays={};(await all("payments")).forEach(p=>pays[p.id]=p);
}
async function loadMe(){
  const s=await getDoc(doc(db,"students",user.uid));me=s.exists()?s.data():null;pays={};mats=[];classes=[];att={};notices=[];
  if(me&&me.status==="aprovado"){
    mats=await mine("enrollments","uid","==",user.uid);
    (await mine("payments","uid","==",user.uid)).forEach(p=>pays[p.id]=p);
    classes=await mine("classes","alunoIds","array-contains",user.uid);
    notices=await all("notices");
    (await mine("attendance","alunoIds","array-contains",user.uid)).forEach(a=>att[a.id]=a);
  }
}
async function loadTeacher(){
  const em=user.email.toLowerCase();classes=await mine("classes","profEmail","==",em);
  att={};(await mine("attendance","profEmail","==",em)).forEach(a=>att[a.id]=a);
}
function hojeISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const brl=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function nomeHoje(){return ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][new Date().getDay()]}
function safeLink(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return ""}}
function matItem(m,c,del){const l=safeLink(m.link);return `<div class="row"><div><b>${esc(m.titulo)}</b>${m.nota?`<small>${esc(m.nota)}</small>`:""}<small>${br(m.data)}${l?` · <a href="${esc(l)}" target="_blank" rel="noopener">Abrir material</a>`:""}</small></div>${del?`<button class="lnk" data-a="delmat" data-id="${c.id}" data-m="${esc(m.id)}">Remover</button>`:""}</div>`}
const finList=()=>Object.values(pays).filter(p=>(p.pagoEm||"").slice(0,7)===fmes).sort((x,y)=>y.pagoEm.localeCompare(x.pagoEm));
function baixarCsv(){
  const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const rows=[["Data","Aluno","Curso","Formato","Valor"],...finList().map(p=>[br(p.pagoEm),p.aluno,p.curso,p.forma,Number(p.valor).toFixed(2).replace(".",",")])];
  const blob=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="financeiro-"+fmes+".csv";a.click();
}
function draw(){
  if(!user){app.innerHTML=`<h1>${ESCOLA}</h1><div class="staff"></div><p>Entre com sua conta Google para se cadastrar ou acompanhar suas aulas.</p>${msg?`<p class="err">${msg}</p>`:""}<button class="btn" data-a="login">Entrar com Google</button>`;return}
  if(view){app.innerHTML=reciboView(view);return}
  const top=`<div class="top"><span>${esc(user.displayName||user.email)}</span><button class="lnk" data-a="sair">Sair</button></div>`;
  const err=msg?`<p class="err">${msg}</p>`:"";
  app.innerHTML=top+err+(isAdmin?adminView():isTeacher?teacherView():studentView());
}
/* ---------- ALUNO ---------- */
function studentView(){
  if(!me)return `<h1>Cadastro</h1><p>Preencha seus dados. O pastor vai aprovar seu cadastro.</p>
  <form id="cad"><div><label for="nome">Nome completo</label><input id="nome" required minlength="5" value="${esc(user.displayName)}"></div>
  <div><label for="tel">WhatsApp</label><input id="tel" type="tel" required placeholder="92 99999-9999"></div>
  <div><label for="nasc">Data de nascimento (opcional)</label><input id="nasc" type="date"></div>
  <div><b>Cursos que você quer fazer</b>${INSTRUMENTOS.map(i=>`<label><input type="checkbox" name="int" value="${i}">${i}</label>`).join("")}</div>
  <label><input id="ok" type="checkbox" required>Autorizo o uso dos meus dados pela escola apenas para organizar aulas e pagamentos.</label>
  <button class="btn" type="submit">Enviar cadastro</button></form>`;
  if(me.status==="pendente")return `<h1>Cadastro enviado</h1><div class="box"><b>Aguardando aprovação do pastor.</b><p>Assim que ele aprovar, você poderá ver suas informações aqui. Volte mais tarde.</p></div>`;
  if(me.status==="recusado")return `<h1>Cadastro não aprovado</h1><div class="box"><p>Fale com o pastor para entender o motivo.</p></div>`;
  const act=mats.filter(m=>m.ativa!==false);
  const TB=[["inicio","Início"],["cal","Calendário"],["avisos","Avisos"],["pag","Pagamentos"]];
  let body="";
  if(stab==="inicio")body=`<h2>Minhas matrículas</h2>${act.length?act.map(m=>`<div class="row"><div><b>${esc(m.curso)}</b><small>Desde ${br(m.inicio)}</small></div><span class="tag">${brl(m.valor)}/mês</span></div>`).join(""):`<div class="empty">Nenhuma matrícula ainda. O pastor vai registrar os cursos que você vai fazer.</div>`}<h2>Minhas aulas</h2>${aulasAluno()}`;
  if(stab==="cal")body=calendarioView();
  if(stab==="avisos")body=avisosView();
  if(stab==="pag")body=`<h2>Pagamentos</h2>${historico()}`;
  return `<h1>Olá, ${esc(me.nome.split(" ")[0])}</h1><div class="staff"></div><div class="tabs" role="tablist">${TB.map(t=>`<button role="tab" data-a="stab" data-t="${t[0]}" aria-selected="${stab===t[0]}">${t[1]}</button>`).join("")}</div>${body}`;
}
const pad=n=>String(n).padStart(2,"0");
const TIPO={aviso:"Aviso",evento:"Evento",semaula:"Sem aula"};
function avisoItem(n,del){return `<div class="row"><div><b>${esc(n.titulo)}</b>${n.texto?`<small>${esc(n.texto)}</small>`:""}<small>${TIPO[n.tipo]||"Aviso"}${n.data?" · "+br(n.data):""}${n.postado?" · postado em "+br(n.postado):""}</small></div>${del?`<button class="lnk" data-a="deln" data-id="${n.id}">Remover</button>`:""}</div>`}
function avisosView(){const l=[...notices].sort((x,y)=>(y.postado||"").localeCompare(x.postado||""));return l.length?l.map(n=>avisoItem(n)).join(""):`<div class="empty">Nenhum aviso por enquanto.</div>`}
function calendarioView(){
  const [a,m]=calMes.split("-").map(Number),dias=new Date(a,m,0).getDate(),off=(new Date(a,m-1,1).getDay()+6)%7,hoje=hojeISO();
  const ev=iso=>notices.filter(n=>n.data===iso),sem=iso=>ev(iso).some(n=>n.tipo==="semaula");
  let cells=DIAS.map(d=>`<b class="sm" style="text-align:center">${d.slice(0,3)}</b>`).join("");
  for(let i=0;i<off;i++)cells+="<span></span>";
  for(let d=1;d<=dias;d++){
    const iso=a+"-"+pad(m)+"-"+pad(d),wd=DIAS[(off+d-1)%7],s=sem(iso),aula=!s&&classes.some(c=>c.dia===wd),e=ev(iso).some(n=>n.tipo!=="semaula");
    cells+=`<button data-a="cal" data-d="${iso}" class="${iso===calDia?"sel":""} ${iso===hoje?"hoje":""}">${d}<br>${aula?'<i class="i-a"></i>':""}${e?'<i class="i-e"></i>':""}${s?'<i class="i-s"></i>':""}</button>`;
  }
  const wd=DIAS[(new Date(calDia+"T12:00:00").getDay()+6)%7],evs=ev(calDia),cancel=sem(calDia);
  const aulas=classes.filter(c=>c.dia===wd).sort((x,y)=>x.hora.localeCompare(y.hora));
  return `<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><button class="lnk" data-a="calmes" data-d="-1">← Anterior</button><b>${nomeMes(calMes)}</b><button class="lnk" data-a="calmes" data-d="1">Próximo →</button></div><div class="cal">${cells}</div><span class="sm"><i class="i-a"></i> aula · <i class="i-e"></i> evento · <i class="i-s"></i> sem aula</span></div>
  <h2>${br(calDia)} · ${wd}</h2>${evs.map(n=>avisoItem(n)).join("")}${aulas.length?aulas.map(c=>`<div class="row"><div><b>${esc(c.instrumento)}</b><small>Prof. ${esc(c.professor)}</small></div><span class="tag ${cancel?"no":""}">${cancel?"Sem aula":c.hora}</span></div>`).join(""):(evs.length?"":`<div class="empty">Nada marcado neste dia.</div>`)}`;
}
function mesesDe(ini){const r=[],h=hojeISO().slice(0,7);let[a,m]=ini.slice(0,7).split("-").map(Number);
  while((a+"-"+String(m).padStart(2,"0"))<=h&&r.length<60){r.push(a+"-"+String(m).padStart(2,"0"));m++;if(m>12){m=1;a++}}return r}
function historico(){
  const l=mats.flatMap(m=>mesesDe(m.inicio).map(mm=>({m,mm,p:pays[m.id+"_"+mm]}))).filter(x=>x.p||x.m.ativa!==false).sort((x,y)=>y.mm.localeCompare(x.mm));
  return l.length?l.map(({m,mm,p})=>`<div class="row"><div><b>${nomeMes(mm)}</b><small>${esc(m.curso)} · ${brl(p?p.valor:m.valor)}${p?" · pago em "+br(p.pagoEm):" · vence dia "+(m.vencimento||10)}</small></div>${p?`<div class="acts"><span class="tag ok">Pago</span><button class="btn sec" data-a="rec" data-id="${p.id}">Recibo</button></div>`:`${atrasado(m,mm)?`<span class="tag no">Atrasado</span>`:`<span class="tag">Em aberto</span>`}`}</div>`).join(""):`<div class="empty">Sem cobranças ainda.</div>`;
}
function extenso(v){
  v=Math.round(Number(v)*100);const r=Math.floor(v/100),c=v%100;
  const U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"],D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const g=n=>{if(n===100)return"cem";const h=Math.floor(n/100),d=n%100,a=[];if(h)a.push(C[h]);if(d)a.push(d<20?U[d]:D[Math.floor(d/10)]+(d%10?" e "+U[d%10]:""));return a.join(" e ")};
  const m=Math.floor(r/1000),u=r%1000,pt=[];
  if(m)pt.push(m===1?"mil":g(m)+" mil");
  if(u)pt.push(g(u));
  const t=pt.length===2&&(u<100||u%100===0)?pt.join(" e "):pt.join(" ");
  if(!r&&!c)return"zero real";
  return (r?t+(r===1?" real":" reais"):"")+(r&&c?" e ":"")+(c?g(c)+(c===1?" centavo":" centavos"):"");
}
function reciboView(p){
  const doc=DOC_ESCOLA?`<div>${esc(DOC_ESCOLA)}</div>`:"";
  return `<div class="rec"><div class="paper"><div class="hd"><div><b>${esc(ESCOLA)}</b>${doc}</div><div style="text-align:right"><div>RECIBO DE PAGAMENTO</div><b>Nº ${esc(p.recibo)}</b></div></div>
  <div class="bd"><div class="val">${brl(p.valor)}</div>
  <div>Recebemos de <b>${esc(p.aluno)}</b> a importância de <b>${brl(p.valor)}</b> (${extenso(p.valor)}), referente à mensalidade de <b>${nomeMes(p.mes)}</b> do curso de <b>${esc(p.curso)}</b>, paga em <b>${br(p.pagoEm)}</b> por <b>${esc(p.forma)}</b>.</div>
  <div>Para clareza, firmamos o presente recibo.</div>
  <div class="ln">${esc(p.por||ESCOLA)}<br>Recebedor</div>
  <div class="ft">Documento emitido eletronicamente. Recibo nº ${esc(p.recibo)}. A autenticidade pode ser confirmada com a escola informando este número.</div></div></div>
  <button class="btn noprint" data-a="print">Imprimir / salvar PDF</button> <button class="lnk noprint" data-a="back">Voltar</button></div>`}
function atrasado(m,mm){return hojeISO()>mm+"-"+String(m.vencimento||10).padStart(2,"0")}
const DIAS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const ordDia=c=>DIAS.indexOf(c.dia)*10000+(+c.hora.replace(":",""));
function ultimaChamada(id){return Object.values(att).filter(x=>x.classId===id).sort((x,y)=>y.date.localeCompare(x.date))[0]}
function aulasAluno(){return classes.length?[...classes].sort((a,b)=>ordDia(a)-ordDia(b)).map(c=>{const u=ultimaChamada(c.id);
  return `<div class="row"><div><b>${esc(c.instrumento)}</b><small>Prof. ${esc(c.professor)}</small>${u?`<small>Última aula ${br(u.date)}: ${u.presentes.includes(user.uid)?"presente":"faltou"}${u.conteudo?" · "+esc(u.conteudo):""}</small>`:""}</div><span class="tag">${c.dia}, ${c.hora}</span></div>${(c.materiais||[]).length?`<div style="margin:-4px 0 12px 14px"><span class="sm">Material</span>${c.materiais.slice().reverse().map(m=>matItem(m,c,false)).join("")}</div>`:""}`}).join(""):`<div class="empty">Você ainda não está em nenhuma turma. O pastor vai te avisar.</div>`}
function aulasAdmin(apr){
  const nome=id=>esc((alunos.find(a=>a.id===id)||{}).nome||"(removido)");
  const profs=`<h2>Professores</h2>${teachers.map(t=>`<div class="row"><div><b>${esc(t.nome)}</b><small>${esc(t.id)}</small></div><button class="lnk" data-a="delp" data-id="${t.id}">Remover</button></div>`).join("")||`<div class="empty">Nenhum professor cadastrado.</div>`}<details><summary>Cadastrar outro professor (só se não for você)</summary><form id="prof"><div><label for="pn">Nome</label><input id="pn" required></div><div><label for="pe">E-mail Google do professor</label><input id="pe" type="email" required></div><button class="btn" type="submit">Cadastrar</button></form></details>`;
  const f=`<form id="turma"><div><label for="ti">Instrumento</label><select id="ti">${INSTRUMENTOS.map(i=>`<option>${i}</option>`).join("")}</select></div><div><label for="tp">Professor</label><select id="tp"><option value="__eu">Eu mesmo (${esc(user.displayName||user.email)})</option>${teachers.map(t=>`<option value="${esc(t.id)}">${esc(t.nome)}</option>`).join("")}</select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="td">Dia</label><select id="td">${DIAS.map(d=>`<option>${d}</option>`).join("")}</select></div><div><label for="th">Horário</label><input id="th" type="time" required></div></div><button class="btn" type="submit">Criar turma</button></form>`;
  const l=[...classes].sort((a,b)=>ordDia(a)-ordDia(b)).map(c=>{
    const ids=c.alunoIds||[],livres=apr.filter(a=>!ids.includes(a.id)),u=ultimaChamada(c.id);
    return `<div class="box" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(c.instrumento)} · ${c.dia}, ${c.hora}</b><button class="lnk" data-a="delc" data-id="${c.id}">Excluir</button></div><span class="sm">Prof. ${esc(c.professor)}${u?` · última chamada ${br(u.date)}: ${u.presentes.length} de ${(u.alunoIds||[]).length} presentes`:""}</span>${ids.map(i=>`<div style="display:flex;justify-content:space-between">${nome(i)}<button class="lnk" data-a="rmst" data-id="${c.id}" data-u="${i}">tirar</button></div>`).join("")||`<span class="sm">Sem alunos nesta turma.</span>`}${livres.length?`<select data-a="addst" data-id="${c.id}"><option value="">Adicionar aluno…</option>${livres.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join("")}</select>`:""}</div>`}).join("");
  return profs+`<h2>Nova turma</h2>${f}<h2>Turmas</h2>${l||`<div class="empty">Nenhuma turma criada ainda.</div>`}`;
}
/* ---------- PROFESSOR ---------- */
function teacherView(emb){
  if(curClass)return chamadaView();
  const em=user.email.toLowerCase(),mine=classes.filter(c=>c.profEmail===em);
  return (emb?"":`<h1>Minhas turmas</h1>`)+`<p>Toque em uma turma para fazer a chamada e enviar material.</p>`+(mine.length?[...mine].sort((a,b)=>ordDia(a)-ordDia(b)).map(c=>`<button class="row" style="width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer" data-a="chamada" data-id="${c.id}"><div><b>${esc(c.instrumento)}</b><small>${(c.alunoIds||[]).length} aluno(s)</small></div><span class="tag">${c.dia}, ${c.hora}</span></button>`).join(""):`<div class="empty">Nenhuma turma atribuída a você.</div>`);
}
function chamadaView(){
  const c=classes.find(x=>x.id===curClass),at=att[c.id+"_"+curDate],ids=c.alunoIds||[];
  const hist=Object.values(att).filter(x=>x.classId===c.id).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,5).map(x=>`<div class="row"><div><b>${br(x.date)}</b><small>${x.presentes.length} de ${(x.alunoIds||[]).length} presentes${x.conteudo?" · "+esc(x.conteudo):""}</small></div></div>`).join("")||`<div class="empty">Nenhuma chamada ainda.</div>`;
  return `<button class="lnk" data-a="volta">← Turmas</button><h1>${esc(c.instrumento)}</h1><p>${c.dia}, ${c.hora}</p>
  <form id="chamada"><div><label for="cd">Data da aula</label><input id="cd" type="date" value="${curDate}"></div>
  ${ids.length?`<b>Presentes</b>`+ids.map(i=>`<label class="row" style="cursor:pointer"><span>${esc((c.nomes||{})[i]||"(aluno)")}</span><input type="checkbox" name="pr" value="${i}" ${!at||at.presentes.includes(i)?"checked":""} style="width:24px;height:24px"></label>`).join(""):`<div class="empty">Sem alunos nesta turma.</div>`}
  <div><label for="ct">O que foi dado / lição de casa</label><textarea id="ct" rows="3">${esc(at?at.conteudo:"")}</textarea></div>
  <button class="btn" type="submit">Salvar chamada</button></form><h2>Últimas aulas</h2>${hist}
  <h2>Material para os alunos</h2>${(c.materiais||[]).slice().reverse().map(m=>matItem(m,c,true)).join("")||`<div class="empty">Nenhum material enviado.</div>`}
  <details><summary>Enviar material</summary><form id="material"><div><label for="mt">Título</label><input id="mt" required></div><div><label for="ml">Link (YouTube, Drive, PDF…)</label><input id="ml" type="url" placeholder="https://"></div><div><label for="mn">Recado / instruções</label><textarea id="mn" rows="2"></textarea></div><button class="btn" type="submit">Enviar para a turma</button></form></details>`;
}
const nomeMes=m=>{const[a,n]=m.split("-");return MESES[+n-1]+" de "+a};
/* ---------- PASTOR ---------- */
function adminView(){
  const meuEmail=user.email.toLowerCase(),minhas=classes.some(c=>c.profEmail===meuEmail);
  const T=[["pend","Pendentes"],["crono","Cronograma"],["avisos","Avisos"],...(minhas?[["minhas","Minhas turmas"]]:[]),["alunos","Alunos"],["aulas","Aulas"],["pag","Pagamentos"],["fin","Financeiro"],["aniv","Aniversários"]];
  const pend=alunos.filter(a=>a.status==="pendente"),apr=alunos.filter(a=>a.status==="aprovado").sort((a,b)=>a.nome.localeCompare(b.nome));
  const tels=alunos.map(a=>(a.tel||"").replace(/\D/g,""));
  const dup=a=>tels.filter(t=>t===(a.tel||"").replace(/\D/g,"")).length>1?` <b class="no">· WhatsApp repetido</b>`:"";
  const wa=a=>`<a href="https://wa.me/55${(a.tel||"").replace(/\D/g,"")}" target="_blank" rel="noopener">${esc(a.tel)}</a>`;
  let body="";
  if(tab==="pend")body=pend.length?pend.map(a=>`<div class="row"><div><b>${esc(a.nome)}</b><small>Quer: ${esc((a.interesses||[]).join(", ")||"—")}</small><small>${wa(a)}${dup(a)} · ${esc(a.email)}</small></div><div class="acts"><button class="btn sec" data-a="set" data-id="${a.id}" data-s="aprovado">Aprovar</button><button class="btn bad" data-a="set" data-id="${a.id}" data-s="recusado">Recusar</button></div></div>`).join(""):`<div class="empty">Nenhum cadastro esperando aprovação.</div>`;
  if(tab==="alunos")body=apr.length?apr.map(a=>{const ms=mats.filter(m=>m.uid===a.id&&m.ativa!==false);
    return `<div class="box" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(a.nome)}</b><span class="sm">${wa(a)}${a.interesses&&a.interesses.length?" · quer: "+esc(a.interesses.join(", ")):""}</span></div><button class="lnk" data-a="del" data-id="${a.id}">Remover</button></div>${ms.map(m=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(m.curso)} · ${brl(m.valor)}/mês · desde ${br(m.inicio)} · vence dia ${m.vencimento||10}</span><button class="lnk" data-a="endm" data-id="${m.id}">Encerrar</button></div>`).join("")||`<span class="sm">Sem matrículas.</span>`}<details><summary>Matricular em um curso</summary><form data-f="mat" data-uid="${a.id}"><select name="curso">${INSTRUMENTOS.map(i=>`<option>${i}</option>`).join("")}</select><input name="valor" type="number" step="0.01" min="0" required placeholder="Valor mensal (R$)"><div><label>Dia de vencimento</label><input name="venc" type="number" min="1" max="28" value="10" required></div><div><label>Data da matrícula</label><input name="inicio" type="date" required value="${hojeISO()}"></div><button class="btn" type="submit">Matricular</button></form></details></div>`}).join(""):`<div class="empty">Nenhum aluno aprovado ainda.</div>`;
  if(tab==="aniv"){
    const h=new Date(),m=h.getMonth()+1,l=apr.filter(a=>a.nascimento&&+a.nascimento.split("-")[1]===m).sort((a,b)=>a.nascimento.slice(8)-b.nascimento.slice(8));
    body=`<h2>Aniversariantes de ${MESES[m-1]}</h2>`+(l.length?l.map(a=>{const d=+a.nascimento.slice(8),idade=h.getFullYear()-+a.nascimento.slice(0,4);return `<div class="row"><div><b>${esc(a.nome)}</b><small>Dia ${d} · ${idade} anos${d===h.getDate()?" · <b class='ok'>é hoje!</b>":""}</small></div>${wa(a)}</div>`}).join(""):`<div class="empty">Sem aniversariantes (a data de nascimento é opcional no cadastro).</div>`);
  }
  if(tab==="avisos")body=`<form id="aviso"><div><label for="at">Tipo</label><select id="at"><option value="aviso">Aviso</option><option value="evento">Evento (aparece no calendário)</option><option value="semaula">Sem aula (feriado, recesso)</option></select></div><div><label for="ati">Título</label><input id="ati" required></div><div><label for="atx">Texto (opcional)</label><textarea id="atx" rows="2"></textarea></div><div><label for="ad">Data (obrigatória para evento e sem aula)</label><input id="ad" type="date"></div><button class="btn" type="submit">Publicar</button></form><h2>Publicados</h2>`+(notices.length?[...notices].sort((x,y)=>(y.postado||"").localeCompare(x.postado||"")).map(n=>avisoItem(n,true)).join(""):`<div class="empty">Nenhum aviso publicado.</div>`);
  if(tab==="aulas")body=aulasAdmin(apr);
  if(tab==="minhas")body=teacherView(true);
  if(tab==="crono"){
    const l=classes.filter(c=>c.dia===cdia).sort((a,b)=>a.hora.localeCompare(b.hora)),hoje=cdia===nomeHoje();
    body=`<div class="tabs">${DIAS.map(d=>`<button data-a="cdia" data-d="${d}" aria-selected="${cdia===d}">${d}</button>`).join("")}</div>`+(l.length?l.map(c=>{const ids=c.alunoIds||[],ch=hoje&&att[c.id+"_"+hojeISO()];
      return `<div class="row"><div><b>${c.hora} · ${esc(c.instrumento)}</b><small>Prof. ${esc(c.professor)} · ${ids.length} aluno(s)</small><small>${ids.map(i=>esc((c.nomes||{})[i]||"")).filter(Boolean).join(", ")}</small></div>${hoje?(ch?`<span class="tag ok">Chamada feita</span>`:`<span class="tag no">Sem chamada</span>`):""}</div>`}).join(""):`<div class="empty">Nenhuma aula em ${cdia}.</div>`);
  }
  if(tab==="fin"){
    const l=finList(),tot=l.reduce((t,p)=>t+Number(p.valor||0),0),pf={};l.forEach(p=>pf[p.forma]=(pf[p.forma]||0)+Number(p.valor||0));
    body=`<div class="box"><label for="fmes">Recebimentos feitos em</label><input id="fmes" type="month" value="${fmes}"><span><b>Total: ${brl(tot)}</b>${Object.keys(pf).map(k=>` · ${esc(k)} ${brl(pf[k])}`).join("")}</span><button class="btn sec" data-a="csv">Exportar planilha (CSV)</button></div><h2>Recebimentos</h2>`+(l.length?l.map(p=>`<div class="row"><div><b>${esc(p.aluno)}</b><small>${br(p.pagoEm)} · ${esc(p.curso)} · ${esc(p.forma)}</small></div><span class="tag">${brl(p.valor)}</span></div>`).join(""):`<div class="empty">Nenhum recebimento neste mês.</div>`);
  }
  if(tab==="pag"){
    const base=mats.filter(m=>m.ativa!==false&&m.inicio.slice(0,7)<=mes),pg=base.filter(m=>pays[m.id+"_"+mes]);
    const tot=pg.reduce((t,m)=>t+Number(pays[m.id+"_"+mes].valor||0),0);
    const atr=mats.filter(m=>m.ativa!==false).flatMap(m=>mesesDe(m.inicio).filter(mm=>mm!==mes&&!pays[m.id+"_"+mm]&&atrasado(m,mm)).map(mm=>({m,mm}))).sort((x,y)=>x.mm.localeCompare(y.mm));
    const atrHtml=atr.length?`<details style="margin-bottom:12px"><summary>Em atraso em outros meses (${atr.length})</summary>${atr.map(({m,mm})=>`<div class="row"><div><b>${esc(m.aluno)}</b><small>${esc(m.curso)} · ${nomeMes(mm)} · ${brl(m.valor)}</small></div><button class="btn sec" data-a="irmes" data-mm="${mm}">Abrir mês</button></div>`).join("")}</details>`:"";
    body=atrHtml+`<div class="box"><label for="mes">Mensalidade referente a</label><input id="mes" type="month" value="${mes}"><span>${pg.length} de ${base.length} pagaram · ${base.filter(m=>!pays[m.id+"_"+mes]&&atrasado(m,mes)).length} atrasado(s) · recebido: ${brl(tot)}</span></div><h2>${nomeMes(mes)}</h2>`+(base.length?base.map(m=>{const k=m.id+"_"+mes,p=pays[k];
      return `<div class="row" style="flex-wrap:wrap"><div><b>${esc(m.aluno)}</b><small>${esc(m.curso)} · ${brl(m.valor)}</small>${p?`<small class="ok">Pago em ${br(p.pagoEm)} · ${esc(p.forma)} · recibo ${esc(p.recibo)}</small>`:`<small class="${atrasado(m,mes)?"no":""}">${atrasado(m,mes)?"Atrasado":"Em aberto"} · vence dia ${m.vencimento||10}</small>`}</div><div class="acts" style="flex-wrap:wrap;justify-content:flex-end">${p?`<button class="btn sec" data-a="rec" data-id="${k}">Recibo</button><button class="lnk" data-a="unpay" data-id="${k}">Desfazer</button>`:`<select style="width:auto" data-forma="${m.id}" aria-label="Forma de pagamento"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option></select><input type="date" style="width:auto" data-pdata="${m.id}" value="${hojeISO()}" aria-label="Data do pagamento"><button class="btn sec" data-a="pay" data-id="${m.id}">Registrar</button>`}</div></div>`}).join(""):`<div class="empty">Nenhuma matrícula ativa neste mês. Matricule alunos na aba Alunos.</div>`);
  }
  return `<h1>Painel do pastor</h1><div class="tabs" role="tablist">${T.map(t=>`<button role="tab" data-a="tab" data-t="${t[0]}" aria-selected="${tab===t[0]}">${t[1]}${t[0]==="pend"&&pend.length?` (${pend.length})`:""}</button>`).join("")}</div>${body}`;
}
/* ---------- EVENTOS ---------- */
const fail=er=>{msg="Algo deu errado ("+(er.code||"erro")+"). Tente de novo.";console.error(er);draw()};
app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;const a=b.dataset.a,id=b.dataset.id;
  try{
    if(a==="login")await signInWithPopup(auth,new GoogleAuthProvider());
    if(a==="sair"){view=null;await signOut(auth)}
    if(a==="tab"){tab=b.dataset.t;draw()}
    if(a==="set"&&(b.dataset.s!=="recusado"||confirm("Recusar este cadastro?"))){await updateDoc(doc(db,"students",id),{status:b.dataset.s});alunos.find(x=>x.id===id).status=b.dataset.s;draw()}
    if(a==="del"&&confirm("Remover este aluno?")){await deleteDoc(doc(db,"students",id));alunos=alunos.filter(x=>x.id!==id);draw()}
    if(a==="endm"&&confirm("Encerrar esta matrícula? Os recibos já emitidos continuam guardados.")){await updateDoc(doc(db,"enrollments",id),{ativa:false});mats.find(x=>x.id===id).ativa=false;draw()}
    if(a==="delc"&&confirm("Excluir esta turma?")){await deleteDoc(doc(db,"classes",id));classes=classes.filter(x=>x.id!==id);draw()}
    if(a==="rmst"&&confirm("Tirar este aluno da turma?")){await updateDoc(doc(db,"classes",id),{alunoIds:arrayRemove(b.dataset.u),["nomes."+b.dataset.u]:deleteField()});const c=classes.find(x=>x.id===id);c.alunoIds=c.alunoIds.filter(x=>x!==b.dataset.u);if(c.nomes)delete c.nomes[b.dataset.u];draw()}
    if(a==="pay"){
      const m=mats.find(x=>x.id===id),k=id+"_"+mes,forma=app.querySelector('[data-forma="'+id+'"]').value;
      const p={uid:m.uid,matId:id,aluno:m.aluno,curso:m.curso,mes,valor:m.valor,forma,pagoEm:app.querySelector('[data-pdata="'+id+'"]').value||hojeISO(),por:user.displayName||user.email,recibo:"R"+Date.now().toString(36).toUpperCase().slice(-7)};
      await setDoc(doc(db,"payments",k),p);pays[k]={id:k,...p};draw();
    }
    if(a==="unpay"&&confirm("Desfazer este pagamento? O recibo deixa de existir.")){await deleteDoc(doc(db,"payments",id));delete pays[id];draw()}
    if(a==="rec"){view=pays[id];draw();scrollTo(0,0)}
    if(a==="back"){view=null;draw()}
    if(a==="chamada"){curClass=id;curDate=hojeISO();draw()}
    if(a==="volta"){curClass=null;draw()}
    if(a==="delp"&&confirm("Remover este professor?")){await deleteDoc(doc(db,"teachers",id));teachers=teachers.filter(x=>x.id!==id);draw()}
    if(a==="cdia"){cdia=b.dataset.d;draw()}
    if(a==="csv")baixarCsv();
    if(a==="delmat"&&confirm("Remover este material?")){const c=classes.find(x=>x.id===id),novo=(c.materiais||[]).filter(x=>x.id!==b.dataset.m);await updateDoc(doc(db,"classes",id),{materiais:novo});c.materiais=novo;draw()}
    if(a==="stab"){stab=b.dataset.t;draw()}
    if(a==="cal"){calDia=b.dataset.d;draw()}
    if(a==="calmes"){let[y,mo]=calMes.split("-").map(Number);mo+=Number(b.dataset.d);if(mo<1){mo=12;y--}if(mo>12){mo=1;y++}calMes=y+"-"+pad(mo);draw()}
    if(a==="irmes"){mes=b.dataset.mm;draw();scrollTo(0,0)}
    if(a==="deln"&&confirm("Remover este aviso?")){await deleteDoc(doc(db,"notices",id));notices=notices.filter(x=>x.id!==id);draw()}
    if(a==="print")window.print();
  }catch(er){fail(er)}
});
app.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="mes"&&t.value){mes=t.value;draw()}
  if(t.id==="cd"&&t.value){curDate=t.value;draw()}
  if(t.id==="fmes"&&t.value){fmes=t.value;draw()}
  if(t.dataset.a==="addst"&&t.value){try{const al=alunos.find(x=>x.id===t.value);await updateDoc(doc(db,"classes",t.dataset.id),{alunoIds:arrayUnion(t.value),["nomes."+t.value]:al.nome});const c=classes.find(x=>x.id===t.dataset.id);c.alunoIds=[...(c.alunoIds||[]),t.value];c.nomes={...(c.nomes||{}),[t.value]:al.nome};draw()}catch(er){fail(er)}}
});
app.addEventListener("submit",async e=>{
  const f=e.target;if(!["turma","cad","prof","chamada","material","aviso"].includes(f.id)&&f.dataset.f!=="mat")return;e.preventDefault();
  try{
    if(f.id==="prof"){const em=$("#pe").value.trim().toLowerCase(),nm=$("#pn").value.trim();await setDoc(doc(db,"teachers",em),{nome:nm});teachers.push({id:em,nome:nm});draw()}
    if(f.id==="aviso"){
      const tipo=$("#at").value,data=$("#ad").value;
      if(tipo!=="aviso"&&!data){alert("Escolha a data do evento ou do dia sem aula.");return}
      const d={tipo,titulo:$("#ati").value.trim(),texto:$("#atx").value.trim(),data,postado:hojeISO(),por:user.displayName||user.email};
      const r=await addDoc(collection(db,"notices"),d);notices.push({id:r.id,...d});draw();
    }
    if(f.id==="material"){
      const c=classes.find(x=>x.id===curClass),raw=$("#ml").value.trim(),lk=safeLink(raw);
      if(raw&&!lk){alert("Link inválido. Use um endereço que comece com https://");return}
      const m={id:Date.now().toString(36),titulo:$("#mt").value.trim(),link:lk,nota:$("#mn").value.trim(),data:hojeISO()};
      const novo=[...(c.materiais||[]),m];await updateDoc(doc(db,"classes",c.id),{materiais:novo});c.materiais=novo;draw();
    }
    if(f.id==="chamada"){
      const c=classes.find(x=>x.id===curClass),k=c.id+"_"+curDate,pres=[...document.querySelectorAll("input[name=pr]:checked")].map(x=>x.value);
      const d={classId:c.id,profEmail:c.profEmail,date:curDate,alunoIds:c.alunoIds||[],presentes:pres,conteudo:$("#ct").value.trim(),salvoEm:serverTimestamp()};
      await setDoc(doc(db,"attendance",k),d);att[k]={id:k,...d};alert("Chamada salva!");draw();
    }
    if(f.id==="turma"){const tp=$("#tp").value;const pr=tp==="__eu"?{id:user.email.toLowerCase(),nome:user.displayName||user.email}:teachers.find(t=>t.id===tp);if(!pr){alert("Escolha o professor.");return}const d={instrumento:$("#ti").value,professor:pr.nome,profEmail:pr.id,dia:$("#td").value,hora:$("#th").value,alunoIds:[],nomes:{}};const r=await addDoc(collection(db,"classes"),d);classes.push({id:r.id,...d});draw()}
    if(f.dataset.f==="mat"){const al=alunos.find(x=>x.id===f.dataset.uid),el=f.elements;if(mats.some(m=>m.uid===al.id&&m.ativa!==false&&m.curso===el.curso.value)&&!confirm("Este aluno já tem matrícula ativa em "+el.curso.value+". Criar outra mesmo assim?"))return;const d={uid:al.id,aluno:al.nome,curso:el.curso.value,valor:Number(el.valor.value),inicio:el.inicio.value,vencimento:Number(el.venc.value)||10,ativa:true};const r=await addDoc(collection(db,"enrollments"),d);mats.push({id:r.id,...d});draw()}
    if(f.id==="cad"){
      const ints=[...document.querySelectorAll("input[name=int]:checked")].map(x=>x.value);
      if(!ints.length){alert("Escolha pelo menos um curso.");return}
      const d={nome:$("#nome").value.trim(),nascimento:$("#nasc").value,tel:$("#tel").value.trim(),interesses:ints,email:user.email,status:"pendente",criadoEm:serverTimestamp()};
      await setDoc(doc(db,"students",user.uid),d);me=d;draw();
    }
  }catch(er){fail(er)}
});
